; ArsyWatch firmware — ESP8266 WiFi air monitor (Fasa 1)
; Stardance Challenge 2026 · contract: docs/api.md §1.2
;
; Build:  pio run
; Flash:  pio run -t upload
; Serial: pio device monitor   (115200)

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; esp12e / nodemcu share the same 4MB flash layout (ESP-12E module).
; 160MHz is left at the 80MHz default: TLS is ~1-2s per request either way,
; and the slower clock is the more conservative choice for a 24h field run.

build_flags =
  -Wall
  -Wextra

; Sources live in src/main.cpp. The original arsywatch.ino stub was removed
; (PlatformIO only compiles src_dir, so leaving it would have been dead weight).
