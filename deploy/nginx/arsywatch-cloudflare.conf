# ==============================================================================
# ArsyWatch — nginx untuk Cloudflare Tunnel
#
# Cloudflare Tunnel (cloudflared) berjalan DI VPS ini dan sambung KELUAR ke
# Cloudflare. Ia hantar  arsywatch.arsyads.dev  ->  http://localhost:8080
#
# Sebab ia berbeza daripada config nginx biasa:
#   - nginx dengar di 8080 (bukan 80/443)
#   - TIADA certbot / Let's Encrypt — Cloudflare yang urus SSL untuk pelayar
#   - TIADA redirect HTTPS — trafik dari cloudflared sudah dalam mesin
#   - Tiada port masuk perlu dibuka dalam AWS security group
#
# Pasang:
#   sudo cp arsywatch-cloudflare.conf /etc/nginx/sites-available/arsywatch
#   sudo ln -sf /etc/nginx/sites-available/arsywatch /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    # Cloudflare Tunnel menunjuk ke port ini
    listen 8080;
    listen [::]:8080;

    server_name arsywatch.arsyads.dev localhost;

    # Fail statik Next.js (hasil `npm run build` -> dashboard/out/)
    root /var/www/arsywatch/out;
    index index.html;

    # Cloudflare sebenarnya yang gzip, tetapi ini berguna untuk ujian tempatan
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Saiz badan — firmware hantar < 10KB
    client_max_body_size 64k;

    # --- SSE: MESTI sebelum /api/ supaya padanan lebih spesifik menang ---
    # Tanpa proxy_buffering off, nginx kumpul event dalam buffer dan dashboard
    # nampak beku walaupun data sedang sampai.
    location = /api/v1/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # --- API (baca + ingest) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # --- Admin (Express handle Basic auth) ---
    location /admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # --- Dashboard statik ---
    # try_files: cuba fail, kemudian .html, kemudian folder, akhirnya 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Halaman sementara sementara dashboard belum dibina
    location = /_placeholder {
        return 200 '{"data":{"service":"arsywatch","status":"server live, dashboard not built yet","api":"/api/v1/health"}}';
        add_header Content-Type application/json;
    }
}
