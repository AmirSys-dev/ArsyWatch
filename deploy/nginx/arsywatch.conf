# ==============================================================================
# ArsyWatch — nginx reverse proxy
#
# Dua server block:
#   1. <domain>     — Dashboard awam (statik) + API baca + SSE (Let's Encrypt)
#   2. api.<domain> — Ingest ESP sahaja (self-signed, fingerprint dipin)
# ==============================================================================

# Ganti <domain> dengan domain sebenar anda (contoh: arsy.my)
# sed -i 's/<domain>/arsy.my/g' /etc/nginx/sites-available/arsywatch

# --- 1. Dashboard awam + API baca --------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name <domain>;

    # certbot akan tulis redirect HTTPS di sini automatik
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <domain>;

    # Ditulis oleh certbot:
    # ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;

    # Fail statik Next.js (hasil `npm run build` -> dashboard/out/)
    root /var/www/arsywatch/out;
    index index.html;

    # Gzip untuk fail statik
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Route statik Next: cuba fail, kemudian .html, kemudian 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # API baca (public GETs)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE aliran langsung — MESTI tidak dibuffer
    # Tanpa arahan ini, nginx kumpul event dalam buffer dan dashboard nampak beku.
    location /api/v1/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Admin surface (Express yang handle Basic auth)
    location /admin/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# --- 2. Ingest ESP (self-signed, fingerprint dipin) --------------------------
# Sijil ini TIDAK diurus oleh certbot. Ia sah 10 tahun dan fingerprint dimasukkan
# ke dalam firmware secrets.h. Renewal Let's Encrypt tidak akan sentuh ini.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.<domain>;

    ssl_certificate     /etc/ssl/arsywatch/api.crt;
    ssl_certificate_key /etc/ssl/arsywatch/api.key;

    # Hanya benarkan TLSv1.2 ke atas (ESP8266 BearSSL sokong TLSv1.2)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Had saiz badan (firmware hantar < 10KB, had keras 64KB)
    client_max_body_size 64k;

    # Ingest endpoint sahaja — tolak semua laluan lain pada domain ini
    location = /api/v1/ingest {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404 '{"error":{"code":"not_found","message":"api.<domain> hanya untuk ingest ESP"}}\n';
        add_header Content-Type application/json;
    }
}
